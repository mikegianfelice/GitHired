[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "githired"
version = "0.2.0"
description = "Canada-remote job discovery, ranking, and daily digests for engineers"
readme = "docs/discovery.md"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
llm-anthropic = ["anthropic>=0.40"]
llm-openai = ["openai>=1.40"]
linkedin-free = ["duckduckgo-search>=6.0"]

[project.scripts]
githired = "jobseek.cli.main:main"
jobseek = "jobseek.cli.main:main"

[tool.setuptools.packages.find]
include = ["jobseek*"]

[tool.setuptools.package-data]
jobseek = ["data/defaults/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tools"]
