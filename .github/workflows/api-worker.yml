name: API Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "api/**"
      - ".github/workflows/api-worker.yml"
      - "jobseek/api_snapshot.py"
      - "jobseek/public_shortlist/export.py"
      - "scripts/export_api_snapshot.py"

# Do not run full discovery on Worker code changes.
concurrency:
  group: githired-api-worker
  cancel-in-progress: true

jobs:
  test:
    name: Worker unit checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Install Python package
        run: python -m pip install -e ".[dev]"
      - name: API snapshot tests
        run: python -m pytest tests/jobseek/test_api_snapshot.py -q
      - name: Install Worker deps
        working-directory: api
        run: npm ci
      - name: Typecheck Worker
        working-directory: api
        run: npx tsc --noEmit
      - name: Node unit + MCP protocol checks
        working-directory: api
        run: npm test
      - name: Validate Worker bundle
        working-directory: api
        run: npx wrangler deploy --dry-run --outdir=.dry-run-out

  deploy:
    name: Deploy Cloudflare Worker
    needs: test
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Check Cloudflare secrets
        id: secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID missing — skipping deploy."
            exit 0
          fi
          echo "present=true" >> "$GITHUB_OUTPUT"
      - name: Install + deploy
        if: steps.secrets.outputs.present == 'true'
        working-directory: api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm ci
          npx wrangler deploy --var ENVIRONMENT:production
